<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Mr. Sam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; padding-bottom: 40px; }
        header { background: linear-gradient(to right, #059669, #14b8a6); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .nav-tabs { display: flex; gap: 10px; padding: 15px; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; position: sticky; top: 0; z-index: 40; }
        .nav-tabs button { padding: 10px 15px; border: none; border-radius: 8px; background: #475569; color: #cbd5e1; cursor: pointer; font-weight: 500; white-space: nowrap; }
        .nav-tabs button.active { background: #059669; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: #334155; border: 1px solid #475569; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
        .btn-primary { background: #059669; color: white; }
        .btn-wa { background: #25D366; color: white; margin-top: 15px; }
        .btn-danger { background: #dc2626; color: white; padding: 5px 10px; width: auto; }
        .btn-edit { background: #2563eb; color: white; padding: 5px 10px; width: auto; }
        input, select { width: 100%; padding: 12px; background: #475569; border: 1px solid #64748b; border-radius: 6px; color: white; margin-top: 5px; font-size: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .product-item { background: #475569; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .suggestion-box { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); border-radius: 8px; padding: 15px; margin-top: 20px; border: 1px solid #3b82f6; }
        .suggestion-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header>
    <h1>📦 Inventario Mr. Sam</h1>
    <p>Popayán - Gestión de Compras</p>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 Hoy</button>
    <button class="tab-btn" data-tab="records">📋 Historial</button>
    <button class="tab-btn" data-tab="products">🏪 Platos</button>
    <button class="tab-btn" data-tab="ingredients">🥘 Insumos</button>
    <button class="tab-btn" data-tab="analytics">📈 Análisis</button>
</div>

<div class="container">
    <div id="dashboard" class="section active"></div>
    <div id="records" class="section"></div>
    <div id="products" class="section"></div>
    <div id="ingredients" class="section"></div>
    <div id="analytics" class="section"></div>
</div>

<script>
    // --- DATOS ---
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let ingredients = JSON.parse(localStorage.getItem('ingredients')) || [];
    let dailyRecords = JSON.parse(localStorage.getItem('dailyRecords')) || [];
    let currentRecord = null;
    let editingProductData = null;
    let showIngForm = false;

    function save() {
        localStorage.setItem('products', JSON.stringify(products));
        localStorage.setItem('ingredients', JSON.stringify(ingredients));
        localStorage.setItem('dailyRecords', JSON.stringify(dailyRecords));
    }

    function getToday() { return new Date().toISOString().split('T')[0]; }
    function formatPrice(n) { return Math.round(n).toLocaleString('es-CO'); }

    // --- NAVEGACIÓN ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.section, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
            btn.classList.add('active');
            renderSection(btn.dataset.tab);
        });
    });

    function renderSection(tab) {
        if(tab === 'dashboard') renderDashboard();
        if(tab === 'records') renderRecords();
        if(tab === 'products') renderProducts();
        if(tab === 'ingredients') renderIngredients();
        if(tab === 'analytics') renderAnalytics();
    }

    function calculateConsumed(sales) {
        const consumed = {};
        ingredients.forEach(i => consumed[i.id] = 0);
        products.forEach(p => {
            const qty = sales[p.id] || 0;
            p.recipe.forEach(r => { consumed[r.ingredientId] += (r.amount * qty); });
        });
        return consumed;
    }

    // --- RENDERIZADO ---
    function renderDashboard() {
        const today = getToday();
        const rec = dailyRecords.find(r => r.date === today);
        let html = `<div class="card" style="text-align:center;">Fecha: <strong>${today}</strong></div>`;

        if (!rec && !currentRecord) {
            html += `<button class="btn btn-primary" onclick="app.initDay()">➕ Iniciar Inventario de Hoy</button>`;
        } else if (currentRecord) {
            html += `<div class="card"><h3>Paso 1: Stock Inicial</h3><div class="grid-2">`;
            ingredients.forEach(ing => {
                html += `<div><label>${ing.name}</label><input type="number" id="init_${ing.id}" value="0"></div>`;
            });
            html += `</div><button class="btn btn-primary" onclick="app.saveInit()">Guardar Stock Inicial</button></div>`;
        } else {
            html += `<div class="card"><h3>Ventas y Mermas</h3><div class="grid-2">`;
            products.forEach(p => {
                html += `<div><label>${p.name}</label><input type="number" id="s_${p.id}" value="${rec.sales[p.id]||0}"></div>`;
            });
            html += `</div><hr style="margin:20px 0;"><div class="grid-2">`;
            ingredients.forEach(ing => {
                html += `<div><label>Merma ${ing.name}</label><input type="number" id="w_${ing.id}" value="${rec.waste[ing.id]||0}"></div>`;
            });
            html += `</div><button class="btn btn-primary" onclick="app.updateToday()">💾 Actualizar Cifras</button></div>`;

            // Sugerencia de Compra + WhatsApp
            const cons = calculateConsumed(rec.sales);
            let total = 0;
            let msg = `*PEDIDO MR. SAM - ${today}*%0A`;
            let itemsMsg = "";
            
            let sugHtml = `<div class="suggestion-box"><h3>🛒 Reposición para Mañana</h3>`;
            ingredients.forEach(ing => {
                const cant = (cons[ing.id] || 0) + (rec.waste[ing.id] || 0);
                if(cant > 0) {
                    const cost = cant * ing.price;
                    total += cost;
                    sugHtml += `<div class="suggestion-item"><span>${ing.name}</span><strong>${cant.toFixed(2)} ${ing.unit}</strong></div>`;
                    itemsMsg += `• *${ing.name}:* ${cant.toFixed(2)} ${ing.unit}%0A`;
                }
            });
            sugHtml += `<div class="suggestion-item" style="font-weight:bold; border:none;"><span>Total Estimado</span><span>$${formatPrice(total)}</span></div>`;
            sugHtml += `<button onclick="app.sendWA('${itemsMsg}')" class="btn btn-wa">📲 Pedir por WhatsApp</button></div>`;
            html += sugHtml;
        }
        document.getElementById('dashboard').innerHTML = html;
    }

    function renderAnalytics() {
        let totalPerdida = 0;
        let html = `<h2>Análisis General</h2>`;
        products.forEach(p => {
            const vendidos = dailyRecords.reduce((acc, r) => acc + (r.sales[p.id]||0), 0);
            let costoU = 0;
            p.recipe.forEach(r => {
                const ing = ingredients.find(i => i.id === r.ingredientId);
                if(ing) costoU += (r.amount * ing.price);
            });
            html += `<div class="card"><strong>${p.name}</strong><br>Vendidos: ${vendidos} | Inversión: $${formatPrice(vendidos * costoU)}</div>`;
        });
        dailyRecords.forEach(r => {
            ingredients.forEach(ing => { totalPerdida += (r.waste[ing.id]||0) * ing.price; });
        });
        html += `<div class="card" style="background:#7f1d1d;"><strong>Total Perdido por Merma: $${formatPrice(totalPerdida)}</strong></div>`;
        document.getElementById('analytics').innerHTML = html;
    }

    function renderProducts() {
        let html = `<button class="btn btn-primary" onclick="app.newP()">+ Nuevo Plato</button>`;
        if(editingProductData) {
            html = `<div class="card"><h3>Receta de ${editingProductData.name || 'Nuevo'}</h3>
            <input type="text" id="p_name" value="${editingProductData.name}" placeholder="Nombre del plato">
            <div id="recipe_list">`;
            editingProductData.recipe.forEach((r, i) => {
                html += `<div class="product-item" style="flex-direction:column;">
                    <select onchange="app.editRec(${i}, 'id', this.value)">${ingredients.map(ing=>`<option value="${ing.id}" ${ing.id==r.ingredientId?'selected':''}>${ing.name}</option>`).join('')}</select>
                    <input type="number" step="0.001" value="${r.amount}" onchange="app.editRec(${i}, 'amt', this.value)">
                    <button class="btn-danger" onclick="app.remRec(${i})">Eliminar</button>
                </div>`;
            });
            html += `</div><button class="btn btn-secondary" onclick="app.addRec()">+ Insumo</button>
            <button class="btn btn-primary" onclick="app.saveP()">Guardar Plato</button></div>`;
        } else {
            products.forEach(p => {
                html += `<div class="product-item"><span>${p.name}</span><div><button class="btn-edit" onclick="app.editP(${p.id})">✏️</button><button class="btn-danger" onclick="app.delP(${p.id})">X</button></div></div>`;
            });
        }
        document.getElementById('products').innerHTML = html;
    }

    function renderIngredients() {
        let html = `<button class="btn btn-primary" onclick="app.toggleIng()">+ Nuevo Insumo</button>`;
        if(showIngForm) {
            html += `<div class="card"><input type="text" id="i_n" placeholder="Nombre"><input type="number" id="i_p" placeholder="Precio"><select id="i_u"><option value="unidad">Unidad</option><option value="kg">Kg</option><option value="L">Litro</option></select><button class="btn btn-primary" onclick="app.saveI()">Guardar</button></div>`;
        }
        ingredients.forEach(ing => {
            html += `<div class="product-item"><span>${ing.name} ($${formatPrice(ing.price)})</span><button class="btn-danger" onclick="app.delI(${ing.id})">X</button></div>`;
        });
        document.getElementById('ingredients').innerHTML = html;
    }

    function renderRecords() {
        let html = dailyRecords.length === 0 ? "No hay datos." : "";
        [...dailyRecords].reverse().forEach(r => {
            html += `<div class="card"><strong>${r.date}</strong><br>Ventas totales: ${Object.values(r.sales).reduce((a,b)=>a+b,0)}</div>`;
        });
        document.getElementById('records').innerHTML = html;
    }

    // --- FUNCIONES APP ---
    window.app = {
        initDay() { currentRecord = { date: getToday(), initialStock: {}, sales: {}, waste: {} }; renderDashboard(); },
        saveInit() {
            ingredients.forEach(ing => currentRecord.initialStock[ing.id] = parseFloat(document.getElementById(`init_${ing.id}`).value) || 0);
            dailyRecords.push(currentRecord); currentRecord = null; save(); renderDashboard();
        },
        updateToday() {
            const rec = dailyRecords.find(r => r.date === getToday());
            products.forEach(p => rec.sales[p.id] = parseInt(document.getElementById(`s_${p.id}`).value) || 0);
            ingredients.forEach(ing => rec.waste[ing.id] = parseFloat(document.getElementById(`w_${ing.id}`).value) || 0);
            save(); alert("¡Guardado!"); renderDashboard();
        },
        sendWA(items) {
            const phone = "573104172451";
            const text = `*PEDIDO MR. SAM - ${getToday()}*%0A${items}`;
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        },
        newP() { if(ingredients.length==0) return alert("Crea insumos"); editingProductData = { name: '', recipe: [{ingredientId:ingredients[0].id, amount:0}] }; renderProducts(); },
        editP(id) { editingProductData = JSON.parse(JSON.stringify(products.find(p=>p.id==id))); renderProducts(); },
        addRec() { editingProductData.recipe.push({ingredientId:ingredients[0].id, amount:0}); renderProducts(); },
        editRec(i, f, v) { if(f=='id') editingProductData.recipe[i].ingredientId = parseInt(v); else editingProductData.recipe[i].amount = parseFloat(v); },
        remRec(i) { editingProductData.recipe.splice(i,1); renderProducts(); },
        saveP() {
            editingProductData.name = document.getElementById('p_name').value;
            if(editingProductData.id) products[products.findIndex(p=>p.id==editingProductData.id)] = editingProductData;
            else { editingProductData.id = Date.now(); products.push(editingProductData); }
            editingProductData = null; save(); renderProducts();
        },
        delP(id) { products = products.filter(p=>p.id!=id); save(); renderProducts(); },
        toggleIng() { showIngForm = !showIngForm; renderIngredients(); },
        saveI() {
            const n = document.getElementById('i_n').value, p = parseFloat(document.getElementById('i_p').value), u = document.getElementById('i_u').value;
            if(n && p) { ingredients.push({id:Date.now(), name:n, price:p, unit:u}); showIngForm=false; save(); renderIngredients(); }
        },
        delI(id) { ingredients = ingredients.filter(i=>i.id!=id); save(); renderIngredients(); }
    };

    renderDashboard();
</script>
</body>
</html>
