<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Sam - Ironclad ERP</title>
    <style>
        :root { --p: #10b981; --s: #3b82f6; --d: #f43f5e; --bg: #0b121f; --c: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 100px; line-height: 1.5; }
        
        header { background: #000; padding: 15px; border-bottom: 3px solid var(--p); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1001; }
        .nav { display: flex; background: #111827; overflow-x: auto; padding: 10px; gap: 8px; position: sticky; top: 58px; z-index: 1000; border-bottom: 1px solid #334155; scrollbar-width: none; }
        .nav::-webkit-scrollbar { display: none; }
        .nav button { padding: 10px 18px; border: none; border-radius: 12px; background: #334155; color: #94a3b8; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 0.8rem; transition: 0.2s; }
        .nav button.active { background: var(--p); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--c); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-h { font-size: 0.75rem; font-weight: 900; color: var(--p); text-transform: uppercase; margin-bottom: 12px; display: block; letter-spacing: 1.2px; }
        
        .row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 14px; border-radius: 14px; margin-bottom: 8px; border: 1px solid #1e293b; }
        input, select { width: 100%; padding: 14px; background: #0b121f; border: 1px solid #475569; border-radius: 12px; color: #fff; margin-top: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--p); }
        label { font-size: 0.8rem; color: #94a3b8; display: block; margin-top: 15px; font-weight: 600; }

        .btn-p { background: var(--p); color: #fff; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-p:active { transform: scale(0.98); }
        .btn-ai { background: linear-gradient(135deg, #7c3aed, #3b82f6); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
        .btn-s { background: var(--s); color: white; border: none; padding: 8px 14px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; font-weight: 700; }
        
        .ai-box { background: rgba(124, 58, 237, 0.08); border: 1px solid #7c3aed; padding: 18px; border-radius: 18px; margin-top: 15px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; color: #e2e8f0; }
        .math-box { background: rgba(59, 130, 246, 0.08); border: 1px solid var(--s); padding: 15px; border-radius: 15px; margin-top: 10px; font-size: 0.9rem; }
        .badge { background: #334155; color: #f1f5f9; padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h3 style="letter-spacing:-1px">MR. SAM <span style="color:var(--p)">IRONCLAD</span></h3>
    <div id="reloj" style="font-size:0.75rem; color:var(--p); font-weight:900; font-family: monospace;"></div>
</header>

<div class="nav">
    <button class="active" data-t="stock">📦 Bodega</button>
    <button data-t="turno">🍔 Turno</button>
    <button data-t="historial">📜 Historial</button>
    <button data-t="cerebro">🧠 Cerebro IA</button>
    <button data-t="config">⚙️ Ajustes</button>
</div>

<div class="container">
    
    <div id="stock" class="section active">
        <div class="card">
            <span class="card-h">Inventario en Tiempo Real</span>
            <div id="stock-list"></div>
        </div>
    </div>

    <div id="turno" class="section">
        <div class="card" style="border-top: 4px solid var(--s)">
            <span class="card-h" style="color:var(--s)">Configuración de la Jornada</span>
            <label>Fecha del Turno (Cambia si es trasnocho)</label>
            <input type="date" id="shift-date"> 
        </div>
        <div class="card">
            <span class="card-h">Producción / Ventas</span>
            <div id="sales-inputs"></div>
            <hr style="border:0; border-top:1px solid #334155; margin:25px 0;">
            <span class="card-h">Mermas (Lo que no se vendió/dañó)</span>
            <div id="waste-inputs"></div>
            <button class="btn-p" onclick="app.closeShift()">💾 FINALIZAR JORNADA Y DESCONTAR</button>
        </div>
    </div>

    <div id="historial" class="section">
        <div class="card">
            <span class="card-h">Libro de Cierres Pasados</span>
            <div id="hist-list"></div>
        </div>
    </div>

    <div id="cerebro" class="section">
        <div class="card">
            <span class="card-h">Inteligencia de Suministros</span>
            <label>Anthropic API Key (Claude 3.5)</label>
            <input type="password" id="api-key" placeholder="Pega tu llave aquí...">
            <button class="btn-ai" onclick="app.askAI()">🔮 PREDECIR COMPRAS PARA MAÑANA</button>
        </div>
        <div id="math-preview" style="display:none">
            <div class="math-box">
                <b style="color:var(--s)">📊 Proyección Matemática (Manual):</b>
                <div id="math-list" style="margin-top:10px; color:#cbd5e1;"></div>
            </div>
        </div>
        <div id="ai-result" class="ai-box" style="display:none"></div>
    </div>

    <div id="config" class="section">
        <div class="card" style="border: 1px solid var(--s)">
            <span class="card-h" style="color:var(--s)">Panel de Calibración</span>
            <label>Margen de Seguridad (Stock Extra)</label>
            <select id="cfg-margin">
                <option value="1.1">10% (Muy ajustado)</option>
                <option value="1.2" selected>20% (Normal Recomendado)</option>
                <option value="1.5">50% (Días de Alto Flujo)</option>
                <option value="2.0">100% (Eventos Masivos)</option>
            </select>
            <label>Días de Historial para Análisis</label>
            <select id="cfg-days">
                <option value="3">3 días (Cambios rápidos)</option>
                <option value="7" selected>7 días (Ciclo semanal)</option>
                <option value="14">14 días (Precisión total)</option>
                <option value="30">30 días (Tendencia larga)</option>
            </select>
            <button class="btn-p" style="background:var(--s)" onclick="app.saveSettings()">GUARDAR CONFIGURACIÓN</button>
        </div>

        <div class="card">
            <span class="card-h">Administración de Insumos</span>
            <div id="cfg-ings" style="margin-bottom:10px"></div>
            <button class="btn-p" onclick="app.addI()">+ NUEVO INSUMO</button>
        </div>
        <div class="card">
            <span class="card-h">Administración de Platos</span>
            <div id="cfg-prods" style="margin-bottom:10px"></div>
            <button class="btn-p" onclick="app.addP()">+ NUEVO PLATO</button>
        </div>
        <button class="btn-p" style="background:var(--d); opacity:0.6; margin-top:30px" onclick="app.reset()">⚠️ REINICIAR TODO EL SISTEMA</button>
    </div>
</div>

<script>
const db = {
    get: (k) => JSON.parse(localStorage.getItem(k)) || [],
    save: (k, d) => localStorage.setItem(k, JSON.stringify(d)),
    ings: () => db.get('ms_ings'),
    prods: () => db.get('ms_prods'),
    recs: () => db.get('ms_recs'),
    stock: () => JSON.parse(localStorage.getItem('ms_stock')) || {},
    settings: () => JSON.parse(localStorage.getItem('ms_settings')) || {margin: 1.2, days: 7}
};

const app = {
    init() {
        document.querySelectorAll('.nav button').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.nav button, .section').forEach(el => el.classList.remove('active'));
                b.classList.add('active');
                document.getElementById(b.dataset.t).classList.add('active');
                app.render(b.dataset.t);
            };
        });
        
        setInterval(() => { 
            const d = new Date();
            document.getElementById('reloj').innerText = d.toLocaleTimeString('es-CO'); 
        }, 1000);

        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('shift-date').value = hoy;
        
        // Cargar Ajustes iniciales
        const s = db.settings();
        document.getElementById('cfg-margin').value = s.margin;
        document.getElementById('cfg-days').value = s.days;
        document.getElementById('api-key').value = localStorage.getItem('ms_api_key') || '';
        
        app.render('stock');
    },

    saveSettings() {
        const s = {
            margin: parseFloat(document.getElementById('cfg-margin').value),
            days: parseInt(document.getElementById('cfg-days').value)
        };
        db.save('ms_settings', s);
        alert("¡Configuración de Mr. Sam actualizada! 🚀");
    },

    render(t) {
        const ings = db.ings(), prods = db.prods(), stock = db.stock(), recs = db.recs();
        
        if(t === 'stock') {
            document.getElementById('stock-list').innerHTML = ings.map(i => `
                <div class="row">
                    <div><b>${i.name}</b><br><small style="color:#94a3b8">${(stock[i.id]||0).toFixed(2)} ${i.unit}</small></div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-s" onclick="app.quickAdd(${i.id},'${i.name}')">COMPRA +</button>
                        <button class="btn-s" style="background:#475569" onclick="app.fixStock(${i.id},'${i.name}')">FIX</button>
                    </div>
                </div>
            `).join('') || 'Agrega insumos en Ajustes.';
        }

        if(t === 'turno') {
            document.getElementById('sales-inputs').innerHTML = prods.map(p => `<label>${p.name}</label><input type="number" class="s-in" data-id="${p.id}" value="0">`).join('');
            document.getElementById('waste-inputs').innerHTML = ings.map(i => `<label>Merma ${i.name} (${i.unit})</label><input type="number" step="0.01" class="w-in" data-id="${i.id}" value="0">`).join('');
        }

        if(t === 'historial') {
            document.getElementById('hist-list').innerHTML = [...recs].reverse().map(r => `
                <div class="row" style="flex-direction:column; align-items:start; gap:8px;">
                    <div style="display:flex; justify-content:space-between; width:100%">
                        <b style="color:var(--p)">📅 ${r.date}</b>
                        <span class="badge">${Object.values(r.sales).reduce((a,b)=>a+b, 0)} platos</span>
                    </div>
                    <div style="font-size:0.75rem; color:#94a3b8; line-height:1.4">
                        ${prods.map(p => r.sales[p.id] ? `${p.name}: <b>${r.sales[p.id]}</b>` : '').filter(x=>x).join(' | ')}
                    </div>
                </div>
            `).join('') || 'Aún no hay cierres registrados.';
        }

        if(t === 'config') {
            document.getElementById('cfg-ings').innerHTML = ings.map(i => `<div class="row"><span>${i.name} (${i.unit})</span> <button class="btn-s" style="background:#475569" onclick="app.editI(${i.id})">✏️</button></div>`).join('');
            document.getElementById('cfg-prods').innerHTML = prods.map(p => `<div class="row"><span>${p.name}</span> <button class="btn-s" style="background:#475569" onclick="app.editP(${p.id})">✏️</button></div>`).join('');
        }
    },

    quickAdd(id, name) {
        const v = prompt(`¿Cuánto compraste de ${name}?`);
        if(v) { const s = db.stock(); s[id] = (s[id]||0) + parseFloat(v); localStorage.setItem('ms_stock', JSON.stringify(s)); app.render('stock'); }
    },

    fixStock(id, name) {
        const v = prompt(`Cantidad REAL hoy de ${name}:`, db.stock()[id]||0);
        if(v !== null) { const s = db.stock(); s[id] = parseFloat(v); localStorage.setItem('ms_stock', JSON.stringify(s)); app.render('stock'); }
    },

    closeShift() {
        const s = db.stock(), p = db.prods(), i = db.ings();
        const fecha = document.getElementById('shift-date').value;
        if(!fecha) return alert("Selecciona la fecha de la jornada.");

        const r = { date: fecha, sales: {}, waste: {} };
        document.querySelectorAll('.s-in').forEach(inp => r.sales[inp.dataset.id] = parseInt(inp.value) || 0);
        document.querySelectorAll('.w-in').forEach(inp => r.waste[inp.dataset.id] = parseFloat(inp.value) || 0);

        i.forEach(ing => {
            let cons = 0;
            p.forEach(pr => { const rc = pr.recipe.find(x => x.id == ing.id); if(rc) cons += (rc.qty * r.sales[pr.id]); });
            s[ing.id] = (s[ing.id] || 0) - (cons + (r.waste[ing.id] || 0));
        });

        const rs = db.recs(); rs.push(r); db.save('ms_recs', rs);
        localStorage.setItem('ms_stock', JSON.stringify(s));
        alert("¡Cierre de jornada guardado!");
        app.render('stock');
    },

    async askAI() {
        const key = document.getElementById('api-key').value;
        const config = db.settings();
        const hist = db.recs().slice(-config.days);
        
        if(hist.length === 0) return alert("Necesitas cierres guardados para analizar.");

        const resDiv = document.getElementById('ai-result');
        const mathDiv = document.getElementById('math-preview');
        const mathList = document.getElementById('math-list');

        // CALCULO MATEMÁTICO
        let mathSug = '';
        db.ings().forEach(ing => {
            let total = 0;
            hist.forEach(h => {
                let dia = 0;
                db.prods().forEach(p => { const rc = p.recipe.find(x => x.id == ing.id); if(rc) dia += (rc.qty * (h.sales[p.id]||0)); });
                total += dia + (h.waste[ing.id]||0);
            });
            let prom = total / hist.length;
            let nec = (prom * config.margin) - (db.stock()[ing.id]||0);
            if(nec > 0) mathSug += `• ${ing.name}: <b>${nec.toFixed(2)} ${ing.unit}</b><br>`;
        });
        
        mathDiv.style.display = 'block';
        mathList.innerHTML = mathSug || "Stock óptimo para mañana.";

        // IA
        if(!key) return;
        localStorage.setItem('ms_api_key', key);
        resDiv.style.display = 'block'; resDiv.innerText = "Claude está analizando la estrategia para Mr. Sam...";

        try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'dangerously-allow-browser': 'true' },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20240620", max_tokens: 800,
                    messages: [{ role: "user", content: `Actúa como socio de Mr. Sam Popayán. Sugiere compras analizando estos datos: ${JSON.stringify({config, stock: db.stock(), history: hist, recipes: db.prods()})}. Sé breve y estratégico.` }]
                })
            });
            const data = await response.json();
            resDiv.innerText = data.content[0].text;
        } catch (e) { resDiv.innerText = "Error IA: Revisa conexión o API Key."; }
    },

    addI() {
        const n = prompt("Nombre Insumo:"), p = prompt("Costo:"), u = prompt("Unidad (und/kg/gr/lt):");
        if(n){ const i=db.ings(); i.push({id:Date.now(), name:n, price:p, unit:u}); db.save('ms_ings', i); app.render('config'); }
    },
    addP() {
        const ings = db.ings(), n = prompt("Nombre Plato:"), pr = prompt("Precio Venta:");
        if(!n || !ings.length) return;
        let recipe = [];
        while(true) {
            let s = prompt("Insumo:\n" + ings.map((i,idx)=>`${idx}: ${i.name}`).join('\n') + "\n'x' para terminar:");
            if(s === 'x' || s === null) break;
            let q = prompt(`¿Cuánto de ${ings[s].name} usa?`);
            recipe.push({id: ings[s].id, qty: parseFloat(q)});
        }
        const p = db.prods(); p.push({id:Date.now(), name:n, price:pr, recipe});
        db.save('ms_prods', p); app.render('config');
    },
    reset() { if(confirm("¿BORRAR ABSOLUTAMENTE TODO?")) { localStorage.clear(); location.reload(); } }
};

app.init();
</script>
</body>
</html>
