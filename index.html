<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Inventario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; padding-bottom: 40px; }
        header { background: linear-gradient(to right, #059669, #14b8a6); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        .btn-danger:hover { background: #b91c1c; }
        .btn-edit { background: #2563eb; color: white; padding: 8px 12px; width: auto; margin: 0; }

        .suggestion-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #3b82f6; }
        .suggestion-item:last-child { border-bottom: none; }
        h2 { margin-bottom: 15px; color: white; }
        h3 { margin-bottom: 10px; color: white; font-size: 16px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }

        .status-box { background: #1e40af; border: 1px solid #3b82f6; border-radius: 8px; padding: 15px; margin-bottom: 15px; color: #bfdbfe; }
        .status-box.ready { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
        .small-text { font-size: 12px; color: #94a3b8; }
        .recipe-item { background: #475569; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>📦 Mi Inventario</h1>
        <p>Gestión automática de compras y ventas</p>
    </header>
    <div class="nav-tabs">
        <button class="tab-btn active" data-tab="dashboard">📊 Hoy</button>

        <button class="tab-btn" data-tab="products">🏪 Productos</button>
        <button class="tab-btn" data-tab="ingredients">🥘 Ingredientes</button>
        <button class="tab-btn" data-tab="analytics">📈 Análisis</button>
    </div>
    <div class="container">
        <div id="dashboard" class="section active"></div>
        <div id="records" class="section"></div>
        <div id="products" class="section"></div>
        <div id="ingredients" class="section"></div>
        <div id="analytics" class="section"></div>
    </div>
    <script>
        let products=[{id:1,name:'Sándwich grande de pollo',category:'sandwich',recipe:[{ingredientId:1,amount:1,unit:'unidad'},{ingredientId:4,amount:0.08,unit:'kg'},{ingredientId:8,amount:1.5,unit:'loncha'},{ingredientId:9,amount:0.03,unit:'L'}]},{id:2,name:'Perro sencillo',category:'hotdog',recipe:[{ingredientId:2,amount:1,unit:'unidad'},{ingredientId:5,amount:1,unit:'unidad'},{ingredientId:7,amount:0.03,unit:'kg'},{ingredientId:8,amount:1.5,unit:'loncha'},{ingredientId:9,amount:0.03,unit:'L'}]},{id:3,name:'Hamburguesa sencilla',category:'burger',recipe:[{ingredientId:3,amount:1,unit:'unidad'},{ingredientId:6,amount:0.1,unit:'kg'},{ingredientId:8,amount:2,unit:'loncha'},{ingredientId:9,amount:0.03,unit:'L'},{ingredientId:10,amount:0.05,unit:'kg'},{ingredientId:11,amount:0.05,unit:'kg'}]}];let ingredients=[{id:1,name:'Pan cubano',unit:'unidad',price:800},{id:2,name:'Pan perro',unit:'unidad',price:600},{id:3,name:'Pan hamburguesa',unit:'unidad',price:700},{id:4,name:'Pollo',unit:'kg',price:15000},{id:5,name:'Salchicha',unit:'unidad',price:2000},{id:6,name:'Carne molida',unit:'kg',price:18000},{id:7,name:'Papas trituradas',unit:'kg',price:3500},{id:8,name:'Queso',unit:'loncha',price:300},{id:9,name:'Salsa de ajo',unit:'L',price:12000},{id:10,name:'Tomate',unit:'kg',price:4000},{id:11,name:'Cebolla',unit:'kg',price:3000}];let dailyRecords=[],currentRecord=null,editingProductId=null,editingProductData=null,showIngredientForm=false;function getToday(){return new Date().toISOString().split('T')[0]}function formatPrice(e){return e.toLocaleString('es-CO',{maximumFractionDigits:0})}document.querySelectorAll('.tab-btn').forEach(e=>{e.addEventListener('click',()=>{const t=e.dataset.tab;document.querySelectorAll('.section').forEach(e=>e.classList.remove('active')),document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')),document.getElementById(t).classList.add('active'),e.classList.add('active'),'dashboard'===t&&renderDashboard(),'records'===t&&renderRec </option><option value="loncha" ${t.unit==='loncha'?'selected':''}>loncha</option></select></div></div>`}),e+=`</div><button class="btn btn-secondary" onclick="window.app.addRecipeItem()" style="margin-top: 10px;">➕ Agregar Ingrediente</button><button class="btn btn-primary" onclick="window.app.saveProduct()">Guardar</button><button class="btn btn-secondary" onclick="window.app.cancelEditProduct()">Cancelar</button></div>`}else e=`<button class="btn btn-primary" onclick="window.app.newProduct()">➕ Nuevo Producto</button>`;e+=`<h2 style="margin-top: 20px;">Productos</h2>`,products.forEach(t=>{e+=`<div class="product-item"><div class="product-info"><div style="flex: 1;"><div class="product-name">${t.name}</div><small style="color: #94a3b8;">${t.category}</small><div class="product-recipe">${t.recipe.map(e=>{const t=ingredients.find(t=>t.id===e.ingredientId);return`${t?.name}: ${e.amount} ${e.unit}`}).join(' | ')}</div></div><div class="btn-group"><button class="btn btn-edit" onclick="window.app.editProduct(${t.id})">✏️</button><button class="btn btn-danger" onclick="window.app.deleteProduct(${t.id})">✕</button></div></div></div>`}),document.getElementById('products').innerHTML=e}function renderIngredients(){let e=`<button class="btn btn-primary" onclick="window.app.toggleIngForm()">➕ Agregar Ingrediente</button>`;showIngredientForm&&(e+=`<div class="card"><h2>Nuevo Ingrediente</h2><div class="form-group"><label>Nombre</label><input type="text" id="ing-name"></div><div class="form-group"><label>Unidad</label><select id="ing-unit"><option value="kg">kg</option><option value="L">L</option><option value="unidad">unidad</option><option value="loncha">loncha</option></select></div><div class="form-group"><label>Precio</label><input type="number" id="ing-price"></div><button class="btn btn-primary" onclick="window.app.saveIngredient()">Agregar</button><button class="btn btn-secondary" onclick="window.app.toggleIngForm()">Cancelar</button></div>`),e+=`<h2 style="margin-top: 20px;">Ingredientes</h2>`,ingredients.forEach(t=>{e+=`<div class="product-item"><div class="product-info"><div style="flex: 1;"><div class="product-name">${t.name}</div><small style="color: #94a3b8;">$${formatPrice(t.price)} por ${t.unit}</small></div><button class="btn btn-danger" onclick="window.app.deleteIngredient(${t.id})">✕</button></div></div>`}),document.getElementById('ingredients').innerHTML=e}function renderAnalytics(){if(0===dailyRecords.length)return void(document.getElementById('analytics').innerHTML='<div class="empty-state">Sin datos</div>');let e='';products.forEach(t=>{const n=dailyRecords.reduce((e,n)=>e+(n.sales[t.id]||0),0),s=Math.round(n/dailyRecords.length),a=Math.max(...dailyRecords.map(e=>e.sales[t.id]||0));e+=`<div class="card"><h2>${t.name}</h2><div class="grid-2"><div style="background: #475569; padding: 15px; border-radius: 8px;"><small style="color: #94a3b8;">Total</small><div style="font-size: 28px; font-weight: bold;">${n}</div></div><div style="background: #475569; padding: 15px; border-radius: 8px;"><small style="color: #94a3b8;">Promedio</small><div style="font-size: 28px; font-weight: bold;">${s}</div></div><div style="background: #475569; padding: 15px; border-radius: 8px;"><small style="color: #94a3b8;">Máximo</small><div style="font-size: 28px; font-weight: bold;">${a}</div></div></div></div>`}),document.getElementById('analytics').innerHTML=e}window.app={startNewRecord(){currentRecord={date:getToday(),initialStock:{},sales:{},waste:{}},ingredients.forEach(e=>{currentRecord.initialStock[e.id]=0,currentRecord.waste[e.id]=0}),products.forEach(e=>{currentRecord.sales[e.id]=0}),renderDashboard()},saveStockInitial(){ingredients.forEach(e=>{currentRecord.initialStock[e.id]=parseFloat(document.getElementById(`init_${e.id}`).value)||0});const e=dailyRecords.findIndex(e=>e.date===currentRecord.date);e>=0?dailyRecords[e].initialStock=currentRecord.initialStock:dailyRecords.push(currentRecord),currentRecord=null,renderDashboard()},editStoc     </script>
</body>
